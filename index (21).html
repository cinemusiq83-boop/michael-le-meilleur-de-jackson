<style>
* { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: 'Oswald', Arial, sans-serif; }

/* ── PLAYER — remplit le tvFrame en 16/9 ── */
/* .pv = toutes les vidéos (active + clips préchargés cachés) */
.pv {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: min(100vw, calc(100vh * 16 / 9));
  height: min(100vh, calc(100vw * 9 / 16));
  background: #000; object-fit: contain;
  opacity: 0; pointer-events: none;
}
.pv.pv-active { opacity: 1; pointer-events: auto; }

/* ── TVFRAME — zone 16/9 centrée pour les overlays ── */
#tvFrame {
  --u: calc(min(100vw, 100vh * 16 / 9) / 2080);   /* 1 px de la photo 2080×1170 */
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: min(100vw, calc(100vh * 16 / 9));
  height: min(100vh, calc(100vw * 9 / 16));
  z-index: 10;
  pointer-events: none;
}

/* ── ENCADRÉ D'INFOS (texte à l'écran) ── */
#infoBox {
  --b: calc(var(--u) * 5);            /* épaisseur du trait */
  --n: calc(var(--u) * 34);           /* taille de l'encoche */
  --h: calc(var(--n) * 0.7071);       /* demi-largeur de l'encoche */
  --nx: 85%;                          /* position de l'encoche */
  position: absolute;
  left: 25.5%; width: 50.5%;
  bottom: 14%;
  padding: calc(var(--u) * 26) calc(var(--u) * 34);
  border: var(--b) solid #fff; border-top: none;
  color: #fff;
  font-family: 'Oswald', Arial, sans-serif; font-weight: 600;
  font-size: calc(var(--u) * 40); line-height: 1.3;
  text-shadow: 0 0 calc(var(--u) * 8) rgba(0,0,0,.55);
  opacity: 0; transition: opacity .5s ease;
}
#infoBox.show { opacity: 1; }
#infoBox::before, #infoBox::after {
  content: ''; position: absolute; top: 0; height: var(--b); background: #fff;
}
#infoBox::before { left: calc(var(--b) * -1); width: calc(var(--nx) - var(--h) + var(--b)); }
#infoBox::after  { left: calc(var(--nx) + var(--h)); right: calc(var(--b) * -1); }
#infoNotch {
  position: absolute; top: calc(var(--n) / -2); left: calc(var(--nx) - var(--n) / 2);
  width: var(--n); height: var(--n); box-sizing: border-box;
  border-right: var(--b) solid #fff; border-bottom: var(--b) solid #fff;
  transform: rotate(45deg);
}

/* ── TITRE DU CLIP (serif élégant, lettres espacées, centré en bas) ── */
#titleBox {
  position: absolute; left: 50%; bottom: 11%;
  transform: translateX(-50%);
  width: 56%; color: #fff; text-align: center;
  font-family: 'Cormorant Garamond', 'EB Garamond', Georgia, 'Times New Roman', serif;
  text-transform: uppercase;
  text-shadow: 0 0 calc(var(--u) * 12) rgba(0,0,0,.55);
  opacity: 0; transition: opacity .6s ease;
}
#titleBox.show { opacity: 1; }
#titleMain {
  font-weight: 600; font-size: calc(var(--u) * 66);
  letter-spacing: .3em; margin-right: -.3em;   /* recentre malgré l'espacement final */
  line-height: 1.28; text-wrap: balance;
}

/* ── GÉNÉRIQUE D'OUVERTURE (0 → 6 s sur Don't Stop) ── */
#intro {
  position: absolute; inset: 0; z-index: 15;
  display: none; align-items: center; justify-content: center;
  background: #000; opacity: 1;
  transition: opacity 1.6s cubic-bezier(.25,.1,.25,1);
}
#intro.on { display: flex; }
#intro.reveal { opacity: 0; }
#introGroup {
  display: flex; flex-direction: column; align-items: center; text-align: center;
  transform: translateY(calc(var(--u) * 12));
  transition: transform .85s cubic-bezier(.22,1,.36,1), opacity .6s ease;
}
#introGroup.up { transform: translateY(calc(var(--u) * -6)); }
#introGroup.out { opacity: 0; }
#introMain {
  font-family: 'Cormorant Garamond', 'EB Garamond', Georgia, 'Times New Roman', serif; font-weight: 600; color: #fff;
  font-size: calc(var(--u) * 100); letter-spacing: .48em; margin-right: -.48em;
  line-height: 1.15; white-space: nowrap; display: flex; justify-content: center;
}
#introSub {
  font-family: 'Cormorant Garamond', 'EB Garamond', Georgia, 'Times New Roman', serif; font-weight: 600; color: #e5e5e5;
  font-size: calc(var(--u) * 27); letter-spacing: .44em; margin-right: -.44em;
  margin-top: calc(var(--u) * 20); line-height: 1.3; white-space: nowrap;
  display: flex; justify-content: center;
}
#intro .ch {
  display: inline-block; opacity: 0; filter: brightness(.4);
  transition: opacity .65s cubic-bezier(.25,.46,.45,.94), filter .65s cubic-bezier(.25,.46,.45,.94);
}
#intro .ch.sp { width: .55em; }
#intro .ch.rev { opacity: 1; filter: brightness(1); text-shadow: 0 0 18px rgba(255,255,255,.14); }
#intro .ch.dis { opacity: .18; filter: brightness(.65); text-shadow: 0 2px 10px rgba(0,0,0,.8);
  transition: opacity 1.35s cubic-bezier(.4,0,.2,1), filter 1.35s cubic-bezier(.4,0,.2,1); }
#intro .ch.dis2 { opacity: .72; filter: brightness(.95); text-shadow: 0 2px 12px rgba(0,0,0,.85);
  transition: opacity 1.35s cubic-bezier(.4,0,.2,1), filter 1.35s cubic-bezier(.4,0,.2,1); }

/* ── INVITE « TOUCHER POUR LANCER » (uniquement si le navigateur bloque le son) ── */
#tapPrompt {
  position: absolute; left: 50%; bottom: 7%; transform: translateX(-50%);
  z-index: 30; color: #fff; white-space: nowrap;
  font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 600; text-transform: uppercase;
  font-size: calc(var(--u) * 30); letter-spacing: .3em; margin-right: -.3em;
  text-shadow: 0 0 calc(var(--u) * 10) rgba(0,0,0,.7);
  opacity: 0; transition: opacity .4s ease; pointer-events: none;
}
#tapPrompt.show { opacity: 1; animation: tapPulse 1.8s ease-in-out infinite; }
@keyframes tapPulse { 0%,100% { opacity: 1; } 50% { opacity: .45; } }

/* ── CONTROLS ── */
#controls {
  position: absolute;
  left: 20px;
  top: max(20px, env(safe-area-inset-top));
  display: flex; gap: 10px; z-index: 20;
  transition: opacity 0.4s ease;
  pointer-events: all;
}
body.controls-hidden #controls { opacity: 0; pointer-events: none; }

button {
  background: rgba(255,255,255,0.12); color: white;
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 6px; padding: 8px 12px; font-size: 15px;
  cursor: pointer; -webkit-appearance: none; touch-action: manipulation;
  font-family: 'Oswald', Arial, sans-serif;
}

/* ── SEARCH ── */
#searchWrapper { position: relative; }
#searchInput {
  background: rgba(0,0,0,0.6); color: white;
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 6px; padding: 6px 12px; font-size: 15px;
  width: 220px; outline: none; -webkit-appearance: none;
  font-family: 'Oswald', Arial, sans-serif;
}
#searchInput::placeholder { color: rgba(255,255,255,0.45); }
#searchResults {
  position: absolute; top: 110%; left: 0; width: 100%; max-height: 50vh;
  overflow-y: auto; background: rgba(0,0,0,0.95);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 6px; z-index: 100; display: none;
  -webkit-overflow-scrolling: touch;
}
#searchResults div {
  padding: 12px 14px; font-size: 14px; color: #fff; cursor: pointer;
  border-bottom: 1px solid rgba(255,255,255,0.07);
  touch-action: manipulation;
  font-family: 'Oswald', Arial, sans-serif;
}
#searchResults div:active { background: rgba(255,45,45,0.35); }
#searchResults div span { color: rgba(255,255,255,0.5); font-size: 12px; }

</style>

let playlist = playlistSource.filter(i => i.url);   // ignore les titres dont le lien est encore vide
let player = null;   // vidéo en cours (créée à la demande, voir plus bas)
let currentIndex = 0;


function initPlaylist() {
  currentIndex = 0;
  loadVideo(currentIndex);
}

/* ══════════════════════════════════════
   PRÉCHARGEMENT DE TOUS LES CLIPS
   Chaque clip a sa propre <video> cachée, déjà chargée : au clic il démarre aussitôt.
══════════════════════════════════════ */
const PRELOAD_MAX      = 300;  // nb max de clips gardés prêts (mets 9999 pour « tous », au prix de la mémoire)
const PRELOAD_FULL     = 30;   // les N premiers sont chargés en entier (début de vidéo), les autres en « metadata »
const PRELOAD_PARALLEL = 2;    // téléchargements simultanés en tâche de fond
const pool = new Map();        // url -> <video>   (le plus récemment utilisé en dernier)
let warmQueue = [], warmRunning = 0, warmStarted = false;

function makePv() {
  const v = document.createElement('video');
  v.className = 'pv';
  v.playsInline = true; v.controls = true; v.muted = true;
  v.addEventListener('ended', onEnded);
  v.addEventListener('timeupdate', () => { if (v === player) updateInfo(v); });
  // Sécurité : un clip doit TOUJOURS démarrer à 0 s
  const forceZero = () => {
    if (v === player && v._fix && v.currentTime > 0.25) {
      v._fix = false;
      console.warn('Clip démarré à', v.currentTime.toFixed(1), 's → retour à 0 :', v._url);
      try { v.currentTime = 0; } catch (e) {}
    }
  };
  v.addEventListener('loadedmetadata', forceZero);
  v.addEventListener('playing', () => { forceZero(); v._fix = false; });
  document.body.insertBefore(v, document.getElementById('tvFrame'));
  return v;
}

function attachSrc(v, url) {
  if (window.Hls && Hls.isSupported() && url.includes('.m3u8')) {
    v._hls = new Hls(); v._hls.loadSource(url); v._hls.attachMedia(v);
  } else {
    v.src = url;
  }
}

function dropEl(url) {
  const v = pool.get(url);
  if (!v) return;
  pool.delete(url);
  if (v._hls) v._hls.destroy();
  v.pause(); v.removeAttribute('src'); v.load(); v.remove();
}

/* Renvoie la <video> d'un clip (la crée et la charge si besoin) */
function getEl(url, preload) {
  let v = pool.get(url);
  if (!v) {
    v = makePv(); v._url = url;
    v.preload = preload || 'auto';
    attachSrc(v, url);
  } else if (preload === 'auto' && v.preload !== 'auto') {
    v.preload = 'auto';
  }
  pool.delete(url); pool.set(url, v);       // marque comme récemment utilisé
  for (const u of pool.keys()) {            // fait de la place si trop de clips
    if (pool.size <= PRELOAD_MAX) break;
    if (pool.get(u) !== player && u !== url) dropEl(u);
  }
  return v;
}

/* Charge en entier le début d'un clip précis */
function boost(url) {
  if (url) getEl(url, 'auto');
}

/* Les 2 clips suivants sont toujours chargés à fond */
function boostNext() {
  if (playlist.length < 2) return;
  for (let k = 1; k <= 2; k++) { const n = playlist[(currentIndex + k) % playlist.length]; if (n) boost(n.url); }
}

/* Tâche de fond : prépare tous les autres clips, les plus proches dans la liste d'abord */
function warmAll() {
  warmQueue = [];
  for (let k = 1; k < playlist.length; k++) warmQueue.push(playlist[(currentIndex + k) % playlist.length].url);
  pump();
}
function pump() {
  while (warmRunning < PRELOAD_PARALLEL && warmQueue.length) {
    const url = warmQueue.shift();
    if (pool.has(url)) continue;
    if (pool.size >= PRELOAD_MAX) { warmQueue = []; return; }
    const full = pool.size < PRELOAD_FULL;
    const v = getEl(url, full ? 'auto' : 'metadata');
    warmRunning++;
    let done = false;
    const finish = () => { if (done) return; done = true; warmRunning--; pump(); };
    v.addEventListener(full ? 'canplaythrough' : 'loadedmetadata', finish, { once: true });
    v.addEventListener('error', finish, { once: true });
    setTimeout(finish, 15000);
  }
}

/* ── ENCADRÉS D'INFOS : item.infos = [{de, a, texte}] (secondes) ── */
const infoBox = document.getElementById('infoBox');
const infoText = document.getElementById('infoText');
const titleBox = document.getElementById('titleBox');
const TITLE_SHOW = { de: 3, a: 12 };   // affichage du titre (secondes) — modifiable par clip : "titreDe" / "titreA"
function hideInfo() { infoBox.classList.remove('show'); infoBox._cur = null; }
function updateInfo(v) {
  const t = v.currentTime;
  const it = v._item || {};
  const td = it.titreDe ?? TITLE_SHOW.de, ta = it.titreA ?? TITLE_SHOW.a;
  titleBox.classList.toggle('show', t >= td && t < ta);
  const e = ((v._item && v._item.infos) || []).find(x => t >= x.de && t < x.a);
  if (!e) { if (infoBox._cur) hideInfo(); return; }
  if (infoBox._cur !== e) { infoBox._cur = e; infoText.textContent = e.texte; }
  infoBox.classList.add('show');
}

/* ── GÉNÉRIQUE D'OUVERTURE : piloté par le temps de la vidéo (item.intro = true) ── */
const introEl = document.getElementById('intro');
const introGroup = document.getElementById('introGroup');
const INTRO_END = 6000;   // ms
function introChars(el, text) {
  el.innerHTML = '';
  return [...text].map(c => {
    const sp = document.createElement('span');
    sp.className = 'ch' + (c === ' ' ? ' sp' : '');
    sp.innerHTML = c === ' ' ? '&nbsp;' : c;
    el.appendChild(sp);
    return sp;
  });
}
const introMain = introChars(document.getElementById('introMain'), 'MICHAEL');
const introSub  = introChars(document.getElementById('introSub'), 'LE MEILLEUR DE JACKSON');
let introOn = false;
function setCh(sp, t, revealAt, disAt, soft) {
  const cls = t >= disAt ? (soft ? 'dis2' : 'dis') : (t >= revealAt ? 'rev' : '');
  const want = 'ch' + (sp.classList.contains('sp') ? ' sp' : '') + (cls ? ' ' + cls : '');
  if (sp.className !== want) sp.className = want;
}
function introFrame() {
  if (!introOn) return;
  const v = player;
  const t = (v ? v.currentTime : 0) * 1000;
  if (t >= INTRO_END) { stopIntro(); return; }
  introMain.forEach((sp, i) =>
    setCh(sp, t, i < 4 ? i * 45 : 180 + (i - 3) * 145, 4300 + i * 95, i > 2));
  introSub.forEach((sp, j) =>
    setCh(sp, t, 980 + j * 32, 4300 + 120 + j * 28, j >= 8));
  introGroup.classList.toggle('up', t >= 980);
  introGroup.classList.toggle('out', t >= 5400);
  introEl.classList.toggle('reveal', t >= 4300);
  requestAnimationFrame(introFrame);
}
function startIntro() {
  introOn = true;
  introEl.classList.remove('reveal'); introGroup.classList.remove('up', 'out');
  [...introMain, ...introSub].forEach(sp => { sp.className = 'ch' + (sp.classList.contains('sp') ? ' sp' : ''); });
  introEl.classList.add('on');
  requestAnimationFrame(introFrame);
}
function stopIntro() { introOn = false; introEl.classList.remove('on'); }

/* ── DÉMARRAGE AVEC SON : le navigateur exige un premier contact (clic / toucher) ── */
const tapPrompt = document.getElementById('tapPrompt');
function waitForTap(v) {
  v.pause();
  tapPrompt.classList.add('show');
  const go = () => {
    ['pointerdown', 'keydown', 'touchstart'].forEach(ev => document.removeEventListener(ev, go, true));
    tapPrompt.classList.remove('show');
    if (v !== player) return;          // un autre clip a été lancé entre-temps
    v.muted = false;
    try { v.currentTime = 0; } catch (e) {}
    v.play().catch(() => {});
  };
  ['pointerdown', 'keydown', 'touchstart'].forEach(ev => document.addEventListener(ev, go, true));
  v._cancelTap = () => ['pointerdown', 'keydown', 'touchstart'].forEach(ev => document.removeEventListener(ev, go, true));
}

function activate(v, item) {
  const old = player;
  if (old && old !== v) {
    old.pause();
    old.classList.remove('pv-active');
    old.muted = true;
    try { old.currentTime = 0; } catch (e) {}   // prêt à repartir du début s'il est rejoué
  }
  if (old && old._cancelTap) old._cancelTap();
  tapPrompt.classList.remove('show');
  player = v;
  v._item = item;
  hideInfo();
  titleBox.classList.remove('show');
  if (item.intro) startIntro(); else stopIntro();
  document.getElementById('titleMain').textContent = item.titre.replace(/(^|\s)'/g, '$1‘').replace(/'/g, '’');
  v._fix = true;
  v.preload = 'auto';
  v.muted = false;
  try { v.currentTime = 0; } catch (e) {}
  v.style.objectFit = item.dezoom ? 'contain' : 'cover';
  v.classList.add('pv-active');
  v.play().catch(() => waitForTap(v));   // son bloqué par le navigateur → on attend un premier contact
}

function loadVideo(index) {
  if (index >= playlist.length) index = 0;
  if (index < 0) index = playlist.length - 1;
  currentIndex = index;
  const item = playlist[currentIndex];
  activate(getEl(item.url, 'auto'), item);
  boostNext();
  if (!warmStarted) {                     // on lance le préchargement général une fois le 1er clip démarré
    warmStarted = true;
    player.addEventListener('playing', () => setTimeout(warmAll, 1500), { once: true });
  }
}

/* Appelé quand on survole / touche un résultat de recherche */
function prefetchForSearch(item) {
  if (item.url !== playlist[currentIndex]?.url) boost(item.url);
}

function onEnded(e) {
  if (e.target !== player) return;
  currentIndex++;
  loadVideo(currentIndex);
}

/* ── DÉMARRAGE DIRECT ── */
initPlaylist();

/* ── MOTEUR DE RECHERCHE ── */
(function(){
  const input = document.getElementById('searchInput');
  const results = document.getElementById('searchResults');

  function renderResults(query) {
    results.innerHTML = '';
    
    if (!query.trim()) {
      const top7 = playlist;
      const header = document.createElement('div');
      header.style.fontSize = '12px';
      header.style.color = 'rgba(255,255,255,0.4)';
      header.style.padding = '8px 14px 4px 14px';
      header.style.textTransform = 'uppercase';
      header.style.letterSpacing = '1px';
      header.textContent = 'Suggestions :';
      results.appendChild(header);

      top7.forEach(item => createResultItem(item));
      results.style.display = 'block';
      return;
    }
    
    const matched = playlistSource.filter(item => item.url && (
      item.titre.toLowerCase().includes(query.toLowerCase()) ||
      item.artiste.toLowerCase().includes(query.toLowerCase()))
    );

    if (matched.length === 0) { results.style.display = 'none'; return; }

    matched.forEach(item => createResultItem(item));
    results.style.display = 'block';
  }

  function createResultItem(item) {
    const div = document.createElement('div');
    div.innerHTML = `${item.titre} <br><span>${item.artiste}</span>`;
    ['mouseenter','touchstart','pointerdown'].forEach(ev =>
      div.addEventListener(ev, () => prefetchForSearch(item), { passive: true }));
    div.addEventListener('click', () => {
      const foundIndex = playlist.findIndex(p => p.url === item.url);
      if (foundIndex !== -1) {
        loadVideo(foundIndex);
      } else {
        playlist.splice(currentIndex + 1, 0, item);
        loadVideo(currentIndex + 1);
      }
      input.value = '';
      results.style.display = 'none';
    });
    results.appendChild(div);
  }

  input.addEventListener('input', () => renderResults(input.value));
  input.addEventListener('focus', () => { showControls(); renderResults(input.value); });
  
  document.addEventListener('click', e => {
    if (!document.getElementById('searchWrapper').contains(e.target)) {
      results.style.display = 'none';
    }
  });
})();

/* ── FULLSCREEN ── */
document.getElementById('fullscreenBtn').addEventListener('click', () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen();
});

/* ── CONTRÔLES AUTO-MASQUAGE ── */
let hideControlsTimer = null;
function showControls() {
  document.body.classList.remove('controls-hidden');
  clearTimeout(hideControlsTimer);
  hideControlsTimer = setTimeout(() => document.body.classList.add('controls-hidden'), 3000);
}
document.addEventListener('mousemove', showControls);
document.addEventListener('touchstart', showControls);

/* ── TVFRAME + PLAYER RESIZE ── */
function resizeTvFrame() {
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  let fw, fh;
  if (vw / vh > 16 / 9) {
    fh = vh; fw = vh * 16 / 9;
  } else {
    fw = vw; fh = vw * 9 / 16;
  }
  const frame = document.getElementById('tvFrame');
  frame.style.width  = fw + 'px';
  frame.style.height = fh + 'px';
  frame.style.setProperty('--u', (fw / 2080) + 'px');
  document.querySelectorAll('.pv').forEach(el => {
    el.style.width  = fw + 'px';
    el.style.height = fh + 'px';
  });
}
resizeTvFrame();
window.addEventListener('resize', resizeTvFrame);
window.addEventListener('orientationchange', () => setTimeout(resizeTvFrame, 100));

</script>
